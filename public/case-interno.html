<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto | Genius Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonte Fira Code e Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

<body style="padding-top: 100px;">

    <!-- HEADER PADRÃO (Agora com o menu completo apontando para a Home) -->
    <header class="navbar" style="background: var(--bg-dark);">
        <div class="logo">
            <a href="index.html"><img src="assets/img/logog.png" alt="Genius Hub" class="logo-img"></a>
        </div>
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a href="index.html#home" class="nav-item">Home</a></li>
                <li><a href="index.html#solucoes" class="nav-item">Soluções</a></li>
                <li><a href="index.html#cases" class="nav-item">Cases</a></li>

        </nav>
        <div class="header-spacer"></div>
    </header>

    <!-- CONTEÚDO DO PROJETO -->
    <section class="section-light" style="min-height: 80vh;">
        <div class="container">
            
            <div class="case-grid">
                <!-- Imagem do Projeto -->
                <div class="case-imagem reveal delay-1">
                    <img id="case-img" src="" alt="Imagem do Projeto" style="width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none;">
                </div>
                
                <!-- Informações do Projeto -->
                <div class="case-info reveal delay-2">
                    <h2 id="case-titulo" style="font-size: 2.5rem; margin-bottom: 20px; text-transform: uppercase;">Carregando...</h2>
                    <p id="case-desc" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px;"></p>
                    
                    <h3 style="margin-bottom: 15px;" id="case-tag-title" style="display: none;">Ideal para:</h3>
                    <ul id="case-tags" style="list-style: none; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px;">
                        <!-- Tags inseridas via JS -->
                    </ul>

                    <a href="#" target="_blank" class="btn-dark" id="case-btn" style="display: none;">Solicitar Orçamento</a>
                </div>
            </div>

            <!-- Botão Voltar no final da seção, alinhado à direita. -->
            <div style="text-align: right; margin-top: 60px;" class="reveal delay-3">
                <a href="javascript:history.back()" class="btn-primary">← Voltar</a>
            </div>

        </div>
    </section>

    <!-- BOTÃO WHATSAPP FIXO -->
    <a href="https://wa.me/5583920036455?text=Olá! Gostaria de saber mais sobre as soluções do Genius Hub." target="_blank" class="whatsapp-float" aria-label="Fale conosco pelo WhatsApp">
        <svg viewBox="0 0 448 512" width="32" height="32" fill="white">
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zM223.9 413.6c-33.6 0-66.5-9-95.4-26l-6.8-4-71 18.6 18.9-69.2-4.4-7C45.2 291 33 258 33 223.9 33 118.7 118.7 33 223.9 33c51 0 98.9 19.9 134.9 55.9s55.9 83.9 55.9 134.9c0 105.2-85.7 190.9-190.8 190.8zm103.8-142.3c-5.7-2.8-33.8-16.7-39-18.6-5.2-1.9-9-2.8-12.8 2.8-3.8 5.7-14.7 18.6-18 22.4-3.3 3.8-6.6 4.3-12.3 1.4-5.7-2.8-24.1-8.9-45.9-28.3-17-15.1-28.5-33.8-31.8-39.5-3.3-5.7-.4-8.8 2.5-11.6 2.6-2.6 5.7-6.6 8.5-9.9 2.8-3.3 3.8-5.7 5.7-9.5 1.9-3.8.9-7.1-.5-9.9-1.4-2.8-12.8-30.9-17.6-42.3-4.6-11.1-9.3-9.6-12.8-9.8-3.3-.2-7.1-.2-10.9-.2-3.8 0-10 1.4-15.2 7.1-5.2 5.7-19.9 19.4-19.9 47.4 0 28 20.4 55.1 23.2 58.8 2.8 3.8 40 61.1 96.9 85.7 13.5 5.8 24 9.3 32.2 11.9 13.6 4.3 26 3.7 35.8 2.2 11-1.7 33.8-13.8 38.6-27.1 4.7-13.3 4.7-24.6 3.3-27.1-1.4-2.6-5.2-4.1-10.9-6.9z"/>

    <!-- Módulo Supabase e Script da Página -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Lógica de Entrada Visual (Reveal)
        function initReveal() {
            const reveals = document.querySelectorAll('.reveal:not(.active)');
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        obs.unobserve(entry.target); 
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

            reveals.forEach(reveal => observer.observe(reveal));
        }
        initReveal();

        // 1. Configura Supabase com a variável correta
        const supabaseUrl = 'https://dwytzdsadnhbtgvlfswi.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3eXR6ZHNhZG5oYnRndmxmc3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTIzNTEsImV4cCI6MjEwNDA2ODM1MX0.s6MBWZRgo5lwf_VYKr2rN4eGqlbXC3VKMzUPb6TseTU';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Extrai o ID da URL
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('item'); 
        const projetoId = urlParams.get('projeto'); 
        const idBuscado = itemId || projetoId;

        // 3. Busca e Injeta Dados
        async function carregarDetalhes() {
            if (!idBuscado) {
                mostrarErro();
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('portfolio')
                    .select('*')
                    .eq('id', idBuscado)
                    .single(); 

                if (error || !data) {
                    mostrarErro();
                    console.error("Erro ao buscar detalhes:", error);
                    return;
                }

                // Preenche a tela com os dados
                document.getElementById('case-titulo').innerText = data.titulo;
                document.getElementById('case-desc').innerText = data.descricao;
                
                const imgElement = document.getElementById('case-img');
                imgElement.src = data.imagem;
                imgElement.alt = data.titulo;
                imgElement.style.display = 'block';

                // Preenche as tags
                const tagsContainer = document.getElementById('case-tags');
                tagsContainer.innerHTML = ''; 
                if (data.tags && Array.isArray(data.tags)) {
                    data.tags.forEach(tag => {
                        const li = document.createElement('li');
                        li.className = 'tag';
                        li.innerText = tag;
                        tagsContainer.appendChild(li);
                    });
                    document.getElementById('case-tag-title').style.display = 'block';
                }

                // Exibe o botão de orçamento e configura o link do WhatsApp com o nome do projeto
                const btnOrcamento = document.getElementById('case-btn');
                const mensagem = `Olá! Gostaria de solicitar um orçamento para o projeto: ${data.titulo}.`;
                btnOrcamento.href = `https://wa.me/5583920036455?text=${encodeURIComponent(mensagem)}`;
                btnOrcamento.style.display = 'inline-block';
                
            } catch (erro) {
                mostrarErro();
                console.error("Erro de execução:", erro);
            }
        }

        // Função de Erro
        function mostrarErro() {
            document.getElementById('case-titulo').innerText = "Conteúdo não encontrado";
            document.getElementById('case-desc').innerText = "O projeto ou solução que você procura não está disponível ou o link está incorreto.";
            document.getElementById('case-img').style.display = 'none';
            document.getElementById('case-tags').innerHTML = '';
            document.getElementById('case-tag-title').style.display = 'none';
            document.getElementById('case-btn').style.display = 'none';
        }

        carregarDetalhes();
    </script>
</body>
</html>
