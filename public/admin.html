<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Genius Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 800px; margin: 40px auto; background: var(--bg-light); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-group, .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-group label { font-weight: 700; color: var(--text-dark); }
        .input-group input, .input-group select, .input-group textarea { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: var(--font-main); font-size: 1rem; }
        .input-group input[type="file"] { padding: 15px; background: #fff; cursor: pointer; }
        .admin-list li { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    </style>
</head>
<body style="padding-top: 100px; background-color: #f4f4f4;">

    <header class="navbar" style="background: var(--bg-dark);">
        <div class="logo">
            <a href="index.html"><img src="assets/img/logog.png" alt="Genius Hub" class="logo-img"></a>
        </div>
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Voltar ao Site</a></li>
            </ul>
        </nav>
        <div class="header-spacer"></div>
    </header>

    <div class="container">
        <div class="admin-container">
            <h2 class="dark-text" style="margin-bottom: 30px; font-size: 2rem;">Painel de Administração</h2>

            <h3 class="dark-text" style="margin-bottom: 20px;">Adicionar / Editar Item</h3>
            <form id="adminForm">
                <div class="input-group">
                    <label>ID do Item (ex: pacman, roleta)</label>
                    <input type="text" id="itemId" required>
                </div>
                <div class="input-group">
                    <label>Tipo</label>
                    <select id="tipoItem">
                        <option value="solucao">Solução</option>
                        <option value="projeto">Case/Projeto</option>
                    </select>
                </div>
                <div class="input-group" id="groupCategoria" style="display: flex;">
                    <label>Categoria (Apenas para Soluções)</label>
                    <select id="itemCategoria">
                        <option value="jogos">Games</option>
                        <option value="gestao">Sistemas</option>
                        <option value="totem">Totem Fotográfico</option>
                        <option value="vr">Realidade Virtual</option>
                        <option value="ia">Lançamentos / IA</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Título</label>
                    <input type="text" id="itemTitulo" required>
                </div>
                <div class="input-group">
                    <label>Resumo (O "Pitch" - max 2 linhas)</label>
                    <textarea id="itemDescricao" rows="2" required></textarea>
                </div>
                <div class="input-group">
                    <label>Tags Rápidas (Plataformas, separadas por vírgula)</label>
                    <input type="text" id="itemTags" placeholder="Ex: Totem Touch, Tablet, Web">
                </div>

                <h3 style="margin-top: 30px; margin-bottom: 10px;">Galeria de Imagens</h3>
                <div class="input-group" style="background: #eaeaea; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                    <label>Selecione até 5 imagens (A primeira será a principal)</label>
                    <input type="file" id="itemImagens" accept="image/*" multiple>
                    <small style="color: #555; margin-top: 5px; font-weight: 600;">Dica: Segure a tecla CTRL ou arraste o mouse para selecionar várias fotos de uma vez.</small>
                </div>

                <hr style="margin: 20px 0; border-color: #ddd;">
                <h3 style="margin-bottom: 15px;">Página Interna (Detalhes & Ferramentas)</h3>

                <div class="input-group" style="background: #e8f0fe; padding: 20px; border-radius: 8px;">
                    <label style="color: #1a73e8;">Recomendar um Sistema (Upsell)?</label>
                    <select id="itemUpsell">
                        <option value="nao">Não exibir nenhuma recomendação</option>
                    </select>
                    <small style="color: #555; margin-top: 5px;">Aparecerá no final da página como uma ferramenta sugerida.</small>
                </div>

                <div class="input-group">
                    <label>Benefícios Rápidos (Ficam no topo junto à imagem - check ✔️)</label>
                    <textarea id="itemBeneficios" rows="3" placeholder="Cartas personalizáveis...&#10;Ranking em tempo real..."></textarea>
                </div>

                <!-- Novos blocos dos cards -->
                <div class="input-group">
                    <label>Card 1: O que você ganha? (quebre a linha para cada tópico)</label>
                    <textarea id="itemOqueGanha" rows="3" placeholder="Atrai atenção para o estande...&#10;Gera lista de clientes..."></textarea>
                </div>
                <div class="input-group">
                    <label>Card 2: Como funciona no evento? (Parágrafo ou tópicos)</label>
                    <textarea id="itemComoFunciona" rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label>Card 3: Personalização e Marca (quebre a linha para cada tópico)</label>
                    <textarea id="itemPersonalizacao" rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label>Card 4: A Entrega (Dados Técnicos - quebre a linha para cada tópico)</label>
                    <textarea id="itemEntrega" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 20px; width: 100%;">Salvar Informações</button>
            </form>

            <h3 class="dark-text" style="margin-top: 50px; margin-bottom: 20px;">Itens Cadastrados</h3>
            <ul id="listaItens" class="admin-list"></ul>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
