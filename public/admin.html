<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Genius Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--bg-light);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #eee;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: 700;
            color: var(--text-dark);
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 1rem;
        }
        .form-group input[type="file"] {
            padding: 8px;
            background: #f9f9f9;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .admin-list {
            list-style: none;
            padding: 0;
        }
        .admin-list li {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }
        .btn-delete {
            background: #e63946;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-delete:hover {
            background: #cc0000;
        }
    </style>
</head>
<body style="padding-top: 100px; background-color: #f4f4f4;">

    <header class="navbar" style="background: var(--bg-dark);">
        <div class="logo">
            <a href="index.html"><img src="assets/img/logog.png" alt="Genius Hub" class="logo-img"></a>
        </div>
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Voltar ao Site</a></li>
            </ul>
        </nav>
        <div class="header-spacer"></div>
    </header>

    <div class="container">
        <div class="admin-container">
            <h2 class="dark-text" style="margin-bottom: 30px; font-size: 2rem;">Painel de Administração</h2>

            <h3 class="dark-text" style="margin-bottom: 20px;">Adicionar Novo Item</h3>
            <form id="adminForm" class="admin-form">
                
                <div class="form-group">
                    <label for="tipoItem">Tipo de Item</label>
                    <select id="tipoItem" required>
                        <option value="solucao">Solução (Fica na Home)</option>
                        <option value="projeto">Projeto de Marca (Cases)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemId">ID único (ex: nova-roleta, cliente-x)</label>
                    <input type="text" id="itemId" required placeholder="Sem espaços ou acentos">
                </div>

                <div class="form-group">
                    <label for="itemTitulo">Título</label>
                    <input type="text" id="itemTitulo" required>
                </div>

                <div class="form-group">
                    <label for="itemCategoria">Categoria (Apenas para Soluções)</label>
                    <select id="itemCategoria">
                        <option value="jogos">Jogos</option>
                        <option value="totem">Totem Fotográfico</option>
                        <option value="ia">Inteligência Artificial</option>
                        <option value="vr">Realidade Virtual</option>
                        <option value="gestao">Gestão e Acesso</option>
                    </select>
                </div>

                <!-- CAMPO ATUALIZADO: UPLOAD DE ARQUIVO -->
                <div class="form-group">
                    <label for="itemImagem">Imagem (Selecione do computador)</label>
                    <input type="file" id="itemImagem" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="itemDescricao">Descrição detalhada</label>
                    <textarea id="itemDescricao" required></textarea>
                </div>

                <div class="form-group">
                    <label for="itemTags">Tags (Separadas por vírgula)</label>
                    <input type="text" id="itemTags" required placeholder="Ex: Feiras, Eventos, Tecnologia">
                </div>

                <button type="submit" class="btn-dark" style="margin-top: 10px;">Adicionar Item</button>
            </form>

            <h3 class="dark-text" style="margin-bottom: 20px;">Itens Cadastrados Localmente</h3>
            <ul id="listaItens" class="admin-list">
                <!-- Itens carregados via JS -->
            </ul>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
